<!doctype html>
<html lang="en">

    <!-- Primary -->

      property="og:image:alt"
      content="HFQ Network Minecraft Lifesteal SMP"

      name="twitter:title"
      content="HFQ Network | Minecraft Lifesteal SMP"
    />

      content="Join HFQ Network, a Minecraft Lifesteal SMP. Fight for hearts, explore ranks and events, vote for rewards, and meet the community on Discord."

      name="twitter:image"
      content="https://hfqmc.xyz/images/og-image.webp"
    />
